name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 4.3.2.0-mars)'
        required: true
        default: '4.3.2.0-mars'

env:
  PYTHON_VERSION: '3.11'
  ELECTRUM_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:

  # ─── Linux AppImage ───────────────────────────────────────────────
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv python3-dev \
            libsecp256k1-dev libsecp256k1-0 \
            libzbar0 libzbar-dev \
            libusb-1.0-0 libusb-1.0-0-dev \
            libudev-dev libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-randr0 \
            libgl1-mesa-dev libfuse2 \
            squashfs-tools zsync desktop-file-utils \
            autoconf automake libtool pkg-config gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install pyinstaller
          python3 -m pip install PyQt5 scrypt cryptography pyaes aiohttp aiohttp-socks \
            'aiorpcx>=0.22,<0.26' dnspython 'protobuf>=3.12,<4' certifi qrcode attrs bitstring qdarkstyle

      - name: Copy system libraries
        run: |
          cp /usr/lib/x86_64-linux-gnu/libsecp256k1.so.0 electrum_mars/libsecp256k1.so.0 || \
            cp /usr/lib/x86_64-linux-gnu/libsecp256k1.so electrum_mars/libsecp256k1.so.0 || true
          cp /usr/lib/x86_64-linux-gnu/libzbar.so.0 electrum_mars/ || true
          cp /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0 electrum_mars/ || true

      - name: Create locale directory
        run: mkdir -p electrum_mars/locale

      - name: Build with PyInstaller
        run: |
          ELECTRUM_VERSION="${{ env.ELECTRUM_VERSION }}" \
          pyinstaller --noconfirm --clean \
            --name electrum-mars \
            --add-data "electrum_mars/*.json:electrum_mars" \
            --add-data "electrum_mars/wordlist:electrum_mars/wordlist" \
            --add-data "electrum_mars/locale:electrum_mars/locale" \
            --add-data "electrum_mars/plugins:electrum_mars/plugins" \
            --add-data "electrum_mars/gui/icons:electrum_mars/gui/icons" \
            --add-data "electrum_mars/lnwire:electrum_mars/lnwire" \
            --add-binary "electrum_mars/libsecp256k1.so.0:." \
            --hidden-import electrum_mars \
            --hidden-import _scrypt \
            --hidden-import electrum_mars.plugins.jade.jade \
            --hidden-import electrum_mars.plugins.jade.jadepy.jade \
            --collect-submodules bitstring \
            --collect-submodules pkg_resources \
            run_electrum

      - name: Smoke test (binary starts)
        run: dist/electrum-mars/electrum-mars --offline -D "$RUNNER_TEMP/em-data" version

      - name: Download AppImage tool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp -r dist/electrum-mars/* AppDir/usr/bin/
          cp electrum_mars/gui/icons/electrum-mars.png AppDir/usr/share/icons/hicolor/128x128/apps/
          cp electrum_mars/gui/icons/electrum-mars.png AppDir/electrum-mars.png
          cat > AppDir/electrum-mars.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Electrum-Mars
          Exec=electrum-mars
          Icon=electrum-mars
          Type=Application
          Categories=Finance;
          DESKTOP
          cp AppDir/electrum-mars.desktop AppDir/usr/share/applications/
          ln -sf usr/bin/electrum-mars AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/Electrum-Mars-${{ env.ELECTRUM_VERSION }}-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/Electrum-Mars-*-x86_64.AppImage

  # ─── Windows (native build on Windows runner) ─────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller PyQt5 cryptography pyaes `
            aiohttp aiohttp-socks 'aiorpcx>=0.22,<0.26' dnspython `
            'protobuf>=3.12,<4' certifi qrcode attrs bitstring qdarkstyle

      - name: Build libsecp256k1
        shell: bash
        run: |
          git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          mkdir build && cd build
          cmake -A x64 -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_ENABLE_MODULE_RECOVERY=ON ..
          cmake --build . --config Release
          cp Release/secp256k1.dll ../../electrum_mars/libsecp256k1-0.dll || true
          # Also try other output locations
          find . -name "*.dll" -exec cp {} ../../electrum_mars/libsecp256k1-0.dll \; 2>/dev/null || true
          ls -la ../../electrum_mars/libsecp256k1*.dll 2>/dev/null || echo "WARNING: dll not found, trying vcpkg"

      - name: Fallback - vcpkg libsecp256k1
        if: ${{ hashFiles('electrum_mars/libsecp256k1-0.dll') == '' }}
        shell: bash
        run: |
          vcpkg install secp256k1:x64-windows 2>/dev/null || true
          find /c/vcpkg -name "secp256k1*.dll" -exec cp {} electrum_mars/libsecp256k1-0.dll \; 2>/dev/null || true

      - name: Create locale directory
        run: mkdir -p electrum_mars/locale
        shell: bash

      - name: Build Windows binary
        run: |
          $env:ELECTRUM_VERSION = "${{ env.ELECTRUM_VERSION }}"
          pyinstaller --noconfirm --clean `
            --name electrum-mars `
            --add-data "electrum_mars/*.json;electrum_mars" `
            --add-data "electrum_mars/wordlist;electrum_mars/wordlist" `
            --add-data "electrum_mars/locale;electrum_mars/locale" `
            --add-data "electrum_mars/plugins;electrum_mars/plugins" `
            --add-data "electrum_mars/gui/icons;electrum_mars/gui/icons" `
            --add-data "electrum_mars/lnwire;electrum_mars/lnwire" `
            --icon electrum_mars/gui/icons/marscoin.ico `
            --add-binary "electrum_mars/libsecp256k1-0.dll;electrum_mars" `
            --hidden-import electrum_mars `
            --hidden-import electrum_mars.plugins.jade.jade `
            --hidden-import electrum_mars.plugins.jade.jadepy.jade `
            --collect-submodules bitstring `
            --collect-submodules pkg_resources `
            run_electrum

      - name: Smoke test (binary starts)
        run: dist/electrum-mars/electrum-mars.exe --offline -D "$env:RUNNER_TEMP/em-data" version

      - name: Create portable zip
        run: Compress-Archive -Path dist/electrum-mars -DestinationPath "Electrum-Mars-${{ env.ELECTRUM_VERSION }}-portable-win64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: Electrum-Mars-*-portable-win64.zip

  # ─── macOS Intel ─────────────────────────────────────────────────
  macos:
    # The app must run on older Macs than the build machine. Homebrew's
    # ready-made libraries only run on the runner's macOS or newer, so the
    # native libraries are built here from source for MACOSX_DEPLOYMENT_TARGET,
    # and the build fails if anything in the app needs a newer system.
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          brew install autoconf automake libtool gettext pkg-config

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install pyinstaller PyQt5 scrypt cryptography pyaes \
            aiohttp aiohttp-socks 'aiorpcx>=0.22,<0.26' dnspython \
            'protobuf>=3.12,<4' certifi qrcode attrs bitstring qdarkstyle

      - name: Build native libraries for the minimum macOS
        run: |
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          contrib/make_libsecp256k1.sh
          contrib/make_zbar.sh
          contrib/make_libusb.sh
          ls -l electrum_mars/*.dylib
          # The wallet looks for these names.
          cd electrum_mars
          for want in libsecp256k1.0.dylib libzbar.0.dylib libusb-1.0.dylib; do
            stem="${want%%.*}"
            [ -f "$want" ] || cp -v "$(ls ${stem}*.dylib | head -1)" "$want"
          done
          for f in libsecp256k1.0.dylib libzbar.0.dylib libusb-1.0.dylib; do
            echo "$f minos: $(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')"
          done

      - name: Create locale directory
        run: mkdir -p electrum_mars/locale

      - name: Build macOS app
        run: |
          ELECTRUM_VERSION="${{ env.ELECTRUM_VERSION }}" \
          pyinstaller --noconfirm --clean contrib/osx/osx.spec

      - name: Make the app portable
        # Point any outside library references inside the app, then fail if
        # anything still refers to the build machine or needs a newer macOS
        # than the minimum.
        run: contrib/osx/make_portable.sh dist/Electrum-Mars.app "$MACOSX_DEPLOYMENT_TARGET"

      - name: Smoke test (app starts)
        run: dist/Electrum-Mars.app/Contents/MacOS/run_electrum --offline -D "$RUNNER_TEMP/em-data" version

      - name: Create DMG
        run: |
          sleep 5
          hdiutil create -fs HFS+ -volname "Electrum-Mars" \
            -srcfolder dist/Electrum-Mars.app \
            dist/Electrum-Mars-${{ env.ELECTRUM_VERSION }}-macos-arm64.dmg || \
          (sleep 10 && hdiutil create -fs HFS+ -volname "Electrum-Mars" \
            -srcfolder dist/Electrum-Mars.app \
            dist/Electrum-Mars-${{ env.ELECTRUM_VERSION }}-macos-arm64.dmg)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Electrum-Mars-*-macos-arm64.dmg

  # ─── Create Release ──────────────────────────────────────────────
  release:
    needs: [linux-appimage, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.zip
            artifacts/**/*.dmg
